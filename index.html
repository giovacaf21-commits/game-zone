<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="GAME ZONE — portail de jeux HTML5 gratuits.">
<title>GAME ZONE — Jeux gratuits</title>

<style>
:root{
  --bg:#070814;
  --card:#101329;
  --card2:#171b39;
  --txt:#f7f8ff;
  --muted:#aeb4d0;
  --pink:#ff4fd8;
  --cyan:#42e8ff;
  --yellow:#ffd34e;
  --green:#4cff9a;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 0%,#202657 0,#070814 42%),
    var(--bg);
  color:var(--txt);
  min-height:100vh;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#080a16ee;
  backdrop-filter:blur(14px);
  border-bottom:1px solid #ffffff12;
}

nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:13px 18px;
}

.logo{
  font-weight:1000;
  letter-spacing:2px;
  font-size:23px;
  color:var(--cyan);
  text-shadow:0 0 22px #42e8ff77;
  margin-right:10px;
  white-space:nowrap;
}

.logo span{color:var(--pink)}

nav button{
  background:none;
  border:0;
  color:var(--muted);
  font-weight:850;
  cursor:pointer;
  padding:9px 10px;
  border-radius:10px;
}

nav button:hover,
nav button.active{
  color:#fff;
  background:#ffffff10;
}

.coins{
  margin-left:auto;
  background:#ffffff0d;
  padding:9px 13px;
  border-radius:999px;
  font-weight:900;
  color:var(--yellow);
  white-space:nowrap;
}

main{
  max-width:1200px;
  margin:auto;
  padding:26px 18px 70px;
}

.page{display:none}
.page.active{display:block}

.hero{
  padding:40px 0 25px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:28px;
  align-items:center;
}

.hero h1{
  font-size:clamp(48px,8vw,88px);
  line-height:.9;
  margin:12px 0 18px;
  letter-spacing:-5px;
}

.gradient{
  background:linear-gradient(
    90deg,
    var(--cyan),
    var(--pink),
    var(--yellow)
  );
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:var(--muted);
  font-size:18px;
  max-width:650px;
}

.hero-card{
  background:linear-gradient(145deg,#191e43,#0c0f22);
  border:1px solid #ffffff18;
  border-radius:28px;
  padding:28px;
  box-shadow:0 20px 60px #0008;
}

.hero-card .icon{
  font-size:55px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:12px 17px;
  font-weight:950;
  cursor:pointer;
  background:linear-gradient(90deg,var(--cyan),var(--pink));
  color:#07101a;
  box-shadow:0 8px 25px #42e8ff22;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn.secondary{
  background:#ffffff10;
  color:#fff;
  box-shadow:none;
  border:1px solid #ffffff16;
}

.btn.buy{
  background:linear-gradient(90deg,var(--yellow),#ff9b4e);
}

.muted{color:var(--muted)}

.tag{
  display:inline-block;
  font-size:11px;
  font-weight:900;
  padding:5px 8px;
  border-radius:999px;
  background:#ffffff0b;
  color:var(--muted);
  margin:4px 3px 0 0;
}

.searchbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin:20px 0 12px;
}

input,
select{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid #ffffff18;
  background:#080a16;
  color:#fff;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--cyan);
}

.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:4px 0 12px;
}

.cat{
  white-space:nowrap;
  border:1px solid #ffffff12;
  background:#ffffff08;
  color:var(--muted);
  border-radius:999px;
  padding:9px 13px;
  font-weight:800;
  cursor:pointer;
}

.cat:hover{color:#fff}

.cat.active{
  color:#07101a;
  background:linear-gradient(
    90deg,
    var(--cyan),
    var(--pink)
  );
  border-color:transparent;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card{
  background:linear-gradient(160deg,#141832,#0e1125);
  border:1px solid #ffffff12;
  border-radius:20px;
  padding:18px;
  transition:.2s;
  box-shadow:0 12px 35px #0003;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#42e8ff44;
}

.game-card{
  padding:0;
  overflow:hidden;
}

.thumb{
  height:150px;
  display:grid;
  place-items:center;
  font-size:68px;
  background:
    radial-gradient(
      circle at 30% 20%,
      #303a7a,
      #12152d 65%
    );
  border-bottom:1px solid #ffffff12;
}

.game-info{padding:16px}

.game-info h3{
  margin:0;
  font-size:19px;
}

.game-info p{
  min-height:48px;
  line-height:1.45;
}

.price{
  font-size:22px;
  font-weight:1000;
  color:var(--yellow);
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:30px 0 15px;
}

.section-title h2{
  margin:0;
  font-size:28px;
}

.notice{
  padding:14px 16px;
  border-radius:14px;
  background:#42e8ff0d;
  border:1px solid #42e8ff22;
  color:#dceeff;
  margin:14px 0;
}

.warn{
  background:#ffd34e0d;
  border-color:#ffd34e33;
  color:#fff0b3;
}

.table-wrap{overflow:auto}

.table{
  width:100%;
  border-collapse:collapse;
  background:#0e1125;
  border-radius:16px;
  overflow:hidden;
}

.table th,
.table td{
  text-align:left;
  padding:14px;
  border-bottom:1px solid #ffffff0c;
}

.table th{
  color:var(--muted);
  font-size:13px;
}

.modal{
  position:fixed;
  inset:0;
  background:#000d;
  display:none;
  place-items:center;
  padding:15px;
  z-index:30;
}

.modal.open{display:grid}

.modalbox{
  width:min(1100px,100%);
  height:min(86vh,800px);
  background:#11152e;
  border:1px solid #ffffff20;
  border-radius:22px;
  padding:15px;
  display:flex;
  flex-direction:column;
}

.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.game-frame{
  width:100%;
  height:100%;
  border:0;
  border-radius:14px;
  background:#05060d;
}

.game-area{
  flex:1;
  min-height:0;
  margin-top:10px;
}

footer{
  text-align:center;
  color:#737b9d;
  padding:30px;
  border-top:1px solid #ffffff0d;
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:800px){
  .hero{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  nav{
    overflow:auto;
  }

  .coins{
    display:none;
  }
}

@media(max-width:560px){
  .grid{
    grid-template-columns:1fr;
  }

  .searchbar{
    grid-template-columns:1fr;
  }

  .hero h1{
    letter-spacing:-3px;
  }

  nav button{
    white-space:nowrap;
  }
}
</style>
</head>
